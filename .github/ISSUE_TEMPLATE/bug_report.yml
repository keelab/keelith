name: 缺陷报告
description: 报告可复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢你帮助改进 Keelith。安全漏洞请遵循 SECURITY.md 私密报告。

  - type: input
    id: version
    attributes:
      label: Keelith 版本
      description: 请提供版本号、tag 或 commit SHA。
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go 版本
      placeholder: go1.26.3
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚说明实际行为及其影响。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小可复现示例或仓库链接。
      placeholder: |
        1. 使用以下配置……
        2. 调用……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、架构及其他可能相关的信息。

  - type: textarea
    id: logs
    attributes:
      label: 日志或补充信息
      description: 请删除日志中的凭据、Token 和个人信息。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现重复报告。
          required: true
        - label: 这不是安全漏洞。
          required: true
